title: fntl.github.io
description: >- # this means to ignore newlines until "baseurl:"
  A personal site built with GitHub Pages and Jekyll. Handwritten Markdown,
  no custom HTML or CSS.
baseurl: ""
url: "https://fntl.github.io"
github_username: fntl

# The theme is vendored in this repo (see _layouts/ and assets/), so we do not
# declare an external `theme:` gem. The only plugin is the built-in feed.
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

permalink: /:title/

exclude:
  - .gitignore
  - README.md
  - LICENSE
